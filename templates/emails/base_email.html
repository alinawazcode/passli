<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block email_title %}Passli Security Notification{% endblock %}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #0b1120;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            color: #cbd5e1;
            line-height: 1.6;
            -webkit-text-size-adjust: 100%;
        }
        .email-wrapper {
            width: 100%;
            background-color: #0b1120;
            padding: 32px 12px;
        }
        .email-container {
            max-width: 580px;
            margin: 0 auto;
            background-color: #0f172a;
            border: 1px solid #1e293b;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5);
        }
        .email-header {
            padding: 28px 32px 20px 32px;
            background: linear-gradient(180deg, #1e293b 0%, #0f172a 100%);
            border-bottom: 1px solid #1e293b;
            text-align: left;
        }
        .brand-badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            text-decoration: none;
        }
        .brand-name {
            font-size: 20px;
            font-weight: 700;
            letter-spacing: -0.025em;
            color: #ffffff;
            margin: 0;
        }
        .brand-tag {
            display: inline-block;
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.08em;
            padding: 3px 8px;
            border-radius: 4px;
            background-color: rgba(14, 165, 233, 0.15);
            color: #38bdf8;
            border: 1px solid rgba(14, 165, 233, 0.3);
            margin-left: 8px;
            vertical-align: middle;
        }
        .email-content {
            padding: 32px;
            color: #cbd5e1;
            font-size: 15px;
        }
        h1, h2, h3 {
            color: #ffffff;
            font-weight: 600;
            margin-top: 0;
            letter-spacing: -0.015em;
        }
        .email-title {
            font-size: 22px;
            color: #f8fafc;
            margin-bottom: 16px;
        }
        p {
            margin: 0 0 16px 0;
            line-height: 1.6;
        }
        .btn-primary {
            display: inline-block;
            background: linear-gradient(135deg, #0284c7 0%, #0ea5e9 100%);
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(14, 165, 233, 0.35);
            text-align: center;
            margin: 20px 0;
        }
        .btn-danger {
            display: inline-block;
            background: linear-gradient(135deg, #b91c1c 0%, #ef4444 100%);
            color: #ffffff !important;
            font-weight: 600;
            font-size: 14px;
            text-decoration: none;
            padding: 12px 28px;
            border-radius: 8px;
            box-shadow: 0 4px 14px rgba(239, 68, 68, 0.35);
            text-align: center;
            margin: 20px 0;
        }
        .otp-box {
            background-color: #0b1120;
            border: 1px solid #334155;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            margin: 24px 0;
        }
        .otp-code {
            font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
            font-size: 32px;
            font-weight: 700;
            letter-spacing: 0.25em;
            color: #38bdf8;
            margin: 0;
        }
        .info-card {
            background-color: #1e293b;
            border-radius: 8px;
            padding: 18px;
            margin: 20px 0;
            border-left: 4px solid #0ea5e9;
        }
        .alert-card {
            background-color: rgba(239, 68, 68, 0.1);
            border: 1px solid rgba(239, 68, 68, 0.3);
            border-radius: 8px;
            padding: 18px;
            margin: 20px 0;
            border-left: 4px solid #ef4444;
        }
        .info-table {
            width: 100%;
            border-collapse: collapse;
            margin: 16px 0;
            font-size: 13px;
        }
        .info-table td {
            padding: 8px 12px;
            border-bottom: 1px solid #1e293b;
        }
        .info-table td.label {
            color: #94a3b8;
            width: 35%;
            font-weight: 500;
        }
        .info-table td.value {
            color: #f1f5f9;
            font-family: 'SFMono-Regular', Consolas, monospace;
        }
        .email-footer {
            padding: 24px 32px;
            background-color: #0b1120;
            border-top: 1px solid #1e293b;
            font-size: 12px;
            color: #64748b;
            text-align: center;
            line-height: 1.5;
        }
        .email-footer a {
            color: #0ea5e9;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="email-wrapper">
        <div class="email-container">
            <div class="email-header">
                <div class="brand-badge">
                    <span class="brand-name">Passli</span>
                    <span class="brand-tag">Cryptographic Vault</span>
                </div>
            </div>

            <div class="email-content">
                {% block email_content %}{% endblock %}
            </div>

            <div class="email-footer">
                <p style="margin: 0 0 8px 0;">This is an automated security communication from your Passli personal vault system.</p>
                <p style="margin: 0 0 8px 0;">Generated on {{ timestamp_utc }} UTC • <a href="{{ app_url }}">Visit Passli Vault</a></p>
                <p style="margin: 0; color: #475569;">© {{ current_year }} Passli. Zero-knowledge cryptographic document storage.</p>
            </div>
        </div>
    </div>
</body>
</html>
