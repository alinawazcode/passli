# CodeRabbit Configuration for Passli (Cryptographic Zero-Knowledge Vault)
# Reference: https://docs.coderabbit.ai/guides/configure-coderabbit

version: 2
language: "en-US"

reviews:
  profile: "chill"  # friendly & encouraging tone for open source contributors
  request_changes_workflow: false
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"

  # Custom system instructions for CodeRabbit reviewing Passli PRs
  instructions: |
    You are an automated senior security engineer and code reviewer for Passli, a zero-knowledge, ephemeral document and credential vault.
    When reviewing Pull Requests, strictly observe the following:
    1. **Security & Secrets**: Ensure NO hardcoded API keys, database passwords, or secret tokens are committed.
    2. **Defensive Programming**: Validate that all user inputs are sanitized, CSRF tokens remain present in all POST forms, and object ownership (IDOR checks) is strictly preserved.
    3. **Compatibility & Non-Breaking**: For beginner/frontend issues (Good First Issues), verify changes are cleanly isolated and do not break backend models, migrations, views, or existing test suites (`python manage.py test`).
    4. **Tone**: Be welcoming, encouraging, and clear with first-time open-source contributors while maintaining high engineering and security standards.

chat:
  auto_reply: true
