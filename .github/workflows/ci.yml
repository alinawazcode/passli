name: Passli Continuous Integration

on:
  push:
    branches: [main, close-remaining-gaps]
  pull_request:
    branches: [main]

jobs:
  lint-and-audit:
    name: Lint & Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Lint & Audit Tools
        run: |
          python -m pip install --upgrade pip
          pip install ruff pip-audit

      - name: Run Ruff Code Quality Linter
        run: |
          ruff check accounts audit config documents sharing tests

      - name: Run pip-audit Vulnerability Scanner
        run: |
          pip-audit -r requirements.txt --desc on

  test-and-coverage:
    name: Test Suite & Coverage
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: passli_ci_test
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DJANGO_SETTINGS_MODULE: config.settings
      DATABASE_URL: postgres://postgres@127.0.0.1:5432/passli_ci_test
      DEBUG: 'False'
      TRUSTED_PROXY_COUNT: '1'
      SECURE_SSL_REDIRECT: 'False'

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install Project Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Generate CI Ephemeral Cryptographic Keys
        run: |
          echo "SECRET_KEY=$(python -c 'import secrets; print(secrets.token_urlsafe(50))')" >> $GITHUB_ENV
          echo "VAULT_MASTER_KEY=$(python -c 'import secrets; print(secrets.token_hex(32))')" >> $GITHUB_ENV

      - name: Django Deploy Check
        run: |
          python manage.py check --deploy

      - name: Execute Full Test Suite with Coverage
        run: |
          coverage run --source=accounts,audit,config,documents,sharing manage.py test tests.unit tests.selenium

      - name: Coverage Threshold Gate
        run: |
          coverage report --fail-under=80

  docker-build:
    name: Docker Image Build Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Passli Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: passli:latest
