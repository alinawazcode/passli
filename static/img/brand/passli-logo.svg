<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 90" width="100%" height="100%" fill="none">
  <defs>
    <radialGradient id="pld-glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#06b6d4" stop-opacity="0.1"/>
      <stop offset="100%" stop-color="#070a13" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pld-shield-base" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0e1526"/>
      <stop offset="100%" stop-color="#04060b"/>
    </linearGradient>
    <linearGradient id="pld-border-grad" x1="10%" y1="0%" x2="90%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="60%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="pld-indigo" x1="20%" y1="10%" x2="80%" y2="90%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#3730a3"/>
    </linearGradient>
    <linearGradient id="pld-cyan" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <linearGradient id="pld-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#34d399"/>
      <stop offset="100%" stop-color="#059669"/>
    </linearGradient>
    <filter id="pld-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#020408" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Left Icon Emblem (Scaled 0.65, centered vertically at x=6, y=4) -->
  <g transform="translate(6, 4) scale(0.65)">
    <circle cx="64" cy="64" r="58" fill="url(#pld-glow)"/>
    <g filter="url(#pld-shadow)">
      <path d="M 64 12 C 86 19, 106 24, 110 37 C 112 65, 99 97, 64 116 C 29 97, 16 65, 18 37 C 22 24, 42 19, 64 12 Z"
            fill="url(#pld-shield-base)" stroke="url(#pld-border-grad)" stroke-width="2.4" stroke-linejoin="round"/>
      <path d="M 64 22 C 47 27, 30 32, 27 42 C 25 62, 36 88, 64 105 L 64 74 C 52 74, 43 65, 43 54 C 43 42, 52 34, 64 34 Z"
            fill="url(#pld-indigo)" opacity="0.95"/>
      <path d="M 64 22 C 81 27, 98 32, 101 42 C 103 62, 92 88, 64 105 L 64 74 C 76 74, 85 65, 85 54 C 85 42, 76 34, 64 34 Z"
            fill="url(#pld-cyan)" opacity="0.92"/>
      <path d="M 50 44 V 36 C 50 28.27, 56.27 22, 64 22 C 71.73 22, 78 28.27, 78 36 V 44"
            fill="none" stroke="#f8fafc" stroke-width="5.5" stroke-linecap="round"/>
      <circle cx="64" cy="54" r="12" fill="#070a13" stroke="#ffffff" stroke-width="2.6"/>
      <path d="M 60.5 54 L 67.5 54 L 69.5 70 L 58.5 70 Z" fill="#ffffff"/>
      <circle cx="64" cy="54" r="5" fill="url(#pld-emerald)"/>
      <circle cx="64" cy="54" r="23" fill="none" stroke="#22d3ee" stroke-width="1.4" stroke-dasharray="4 6" opacity="0.8"/>
    </g>
  </g>

  <!-- Bespoke Typography "Passli" -->
  <g transform="translate(98, 55)">
    <text font-family="system-ui, -apple-system, 'Geist', 'Inter', 'Segoe UI', sans-serif" 
          font-weight="800" 
          font-size="44" 
          letter-spacing="-1.5" 
          fill="#f8fafc">
      Passl<tspan fill="#818cf8">i</tspan>
    </text>

    <!-- Active Quantum Pulse Node on 'i' dot -->
    <circle cx="127" cy="-28" r="4.5" fill="url(#pld-emerald)"/>
    <circle cx="127" cy="-28" r="7.5" fill="none" stroke="#34d399" stroke-width="1.4" opacity="0.8"/>

    <!-- Subtitle: CONTROLLED DOCUMENT VAULT -->
    <text x="2" 
          y="18" 
          font-family="'JetBrains Mono', monospace" 
          font-weight="600" 
          font-size="9.5" 
          letter-spacing="4" 
          fill="#94a3b8">
      CONTROLLED DOCUMENT VAULT
    </text>
  </g>
</svg>